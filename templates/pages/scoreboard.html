<main>
    {% if scoreboard|length == 1 or scoreboard[0][1] == scoreboard[1][1] %}
    <span id="status" data="draw_table"></span>
    {% else %}
    <span id="status" data="victory"><p>{{scoreboard[0][0]}}</p></span>
    {% endif %} 
    <table id="scores">
        <thead>
            <td data="username_table"></td>
            <td data="score_table"></td>
        </thead>
        <tbody>
            {% for s in scoreboard %}
            <tr>
                <td>{{s[0]}}</td>
                <td>{{s[1]}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</main>
<link rel="stylesheet" href="{{url_for('static', filename='css/pages/scoreboard.css')}}">
