<main>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
        <div class="flash">
        <p data="{{message}}"></p>
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}
    </div>
</main>
<link rel="stylesheet" href="{{url_for('static', filename='css/widgets/error.css')}}">
