<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blokus</title>
</head>
<body>
    <form action="" method="post">
        <label for="username">Pseudo : </label>
        <input type="text" name="username" placeholder="john_doe"><br>
        <label for="password">Mot de passe : </label>
        <input type="password" name="password">
        <p>Doit faire au moins 6 caractères, contenir une lettre, un chiffre ainsi qu’un 
            <span class="tooltip">caractère spécial
                <span class="tooltiptext">. , ! : ; ? / % * # @ { } [ ] $ £ € ~ ^ & | § < ></span>
            </span>
        </p><br>
        <label for="confirmation">Confirmation du mot de passe : </label>
        <input type="password" name="confirmation"><br>
        <input type="submit">
    </form>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
        <p>{{message}}</p>
        {% endfor %}
    {% endif %}
    {% endwith %}
</body>
<link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">

</html>
