<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blokus</title>
</head>
<body>
    <table id="grid">
        {% for line in grid %}
        <tr>
            {% for cell in line %}

            <td class="c{{ cell }}"></td>

            {% endfor %}
        </tr>
        {% endfor %}
    </table>

    <link rel="stylesheet" href="{{url_for('static', filename='grid.css')}}">
    <script src="{{url_for('static', filename='updateGrid.js')}}"></script>
</body>
</html>
