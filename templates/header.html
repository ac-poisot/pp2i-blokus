<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blokus</title>
</head>
<body>
    <header>
            <nav id="navbar">
                <ul>
                    <li id="name">
                        <a href="/">BLOKUS</a>
                    </li>
                    <li id="games">
                        <a href="/games" data="play"></a>
                    </li>
                    <li id="credits">
                        <a href="/credits" data="credits"></a>
                    </li>
                    {% if pid != -1 %}
                        <li id="profile">
                            <a href="/profile/{{pid}}" data="my_profile"></a>
                        </li>
                    {% else %}
                        <li id="login">
                            <a href="/login" data="login"></a>
                        </li>
                        <li id="signup">
                            <a href="/signup" data="signup"></a>
                        </li>
                        <li id="english">
                            <a href="" onclick="changeLanguage('en')">English</a>
                        </li>                      
                        <li id="french">
                            <a href="" onclick="changeLanguage('fr')">Français</a>
                        </li>
                    {% endif %}
                </ul>
            </nav>
    </header>
    <link rel="stylesheet" href="{{url_for('static', filename='css/header.css')}}">
    <script src="{{url_for('static', filename='main.js')}}"></script>
</body>
</html>
